<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Research Radar</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#eaf0fa;font:15px system-ui,'Malgun Gothic',sans-serif}header{background:#141e30;padding:30px max(20px,calc((100% - 1160px)/2));border-bottom:1px solid #344058}h1{margin:0;font-size:30px}p,.muted{color:#9aabc5}main{max-width:1160px;margin:auto;padding:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,.panel,.entry{border:1px solid #33425a;background:#172237;border-radius:12px;padding:16px}.stat b{display:block;font-size:26px}.stat span,.meta{color:#a6b6cb;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}input,select,button{background:#23324a;color:#fff;border:1px solid #405370;border-radius:7px;padding:9px}input{flex:2;min-width:180px}select{flex:1;min-width:130px}button{cursor:pointer}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.source{display:flex;justify-content:space-between;margin:9px 0;gap:10px;font-size:13px}.source a{color:#c6dcff;text-decoration:none}.entry{margin-bottom:10px}.entry>a{color:#eaf0fa;font-weight:650;font-size:17px;text-decoration:none}.entry>a:hover{text-decoration:underline}.entry footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.tag{color:#bed6ff;background:#263e5c;border-radius:14px;padding:3px 8px}.error{color:#ffa5a5}.ok{color:#83d5ae}.empty{padding:32px;color:#a6b6cb;text-align:center}@media(max-width:750px){.layout{grid-template-columns:1fr}.stat{padding:10px}.stat b{font-size:20px}}
header{background:linear-gradient(115deg,#112b38,#151e33)}header:before{content:"RESEARCH INTELLIGENCE  /  01";display:block;letter-spacing:.16em;font-size:11px;color:#83d5ae;margin-bottom:12px}.layout{align-items:start}h1{letter-spacing:-.04em;font-size:clamp(32px,5vw,54px)}@media(max-width:750px){.layout aside{max-height:150px;overflow:auto}}.source button{width:100%;display:flex;justify-content:space-between;text-align:left;align-items:center;background:transparent;border:0;padding:6px;color:#dbe8ff}.source button:hover,.source button[aria-pressed=true]{background:#263e5c}.source span{white-space:nowrap}.entry footer{flex-wrap:wrap;gap:6px}.meta{line-height:1.65}.date-groups{display:flex;gap:8px;flex-wrap:wrap}.date-groups button[aria-pressed=true]{background:#c7eee3;color:#122630;font-weight:700}.source{align-items:center}.source-ref{padding:5px}#team-panel{margin-bottom:14px}#team-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}#team-links a,.team-origin{color:#bed6ff}</style></head><body><header><h1>AI Research Radar</h1><p>각 기관이 자체 웹사이트에 게시한 연구 글만 모았습니다. 상세 글에 표시된 날짜로 정렬하며, 글에 날짜가 없으면 공식 목록의 날짜를 사용합니다.</p><small id="updated" class="muted">데이터 확인 중…</small></header><main><div class="stats"><div class="stat"><b id="sources-count">…</b><span>추적 기관</span></div><div class="stat"><b id="items-count">0</b><span>연구 항목</span></div><div class="stat"><b id="new-count">0</b><span>최근 7일 표기일</span></div></div><div class="toolbar"><input aria-label="제목 또는 기관 검색" id="query" placeholder="제목·기관 검색"><select aria-label="기관 필터" id="org"><option value="">모든 기관</option></select><select aria-label="읽음 및 북마크 필터" id="view"><option value="all">전체</option><option value="unread">읽지 않음</option><option value="saved">북마크</option></select></div><div class="layout"><aside class="panel"><b>연구조직</b><div id="sources"></div><p class="muted" style="font-size:12px">기관을 선택하면 해당 연구 목록이 표시됩니다. 발견일은 대시보드에서 처음 확인한 날짜입니다.</p></aside><section><section id="team-panel" class="panel" hidden><strong>Anthropic 팀별 연구 목록</strong><p class="muted">팀을 선택하면 그 팀의 공식 목록에 실린 글만 표시합니다. 화살표는 팀의 공식 페이지를 엽니다.</p><label>팀 <select id="team"></select></label><div id="team-links"></div></section><div class="date-groups" role="group" aria-label="발표일 구분"><button id="dated" aria-pressed="true">공홈 표기일 최신순</button><button id="undated" aria-pressed="false">공홈 날짜 미확인</button></div><p id="results" aria-live="polite"></p><div id="feed"></div><button id="more" hidden>연구 더 보기</button></section></div></main><script>
let sources=[],items=[],status={};const $=id=>document.getElementById(id);const key='radar-state-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const save=()=>localStorage.setItem(key,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let limit=40, dateGroup='dated';
function publicationDay(value){
  if(/^\d{4}$/.test(value)||/^\d{4}-(0[1-9]|1[0-2])$/.test(value))return value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return '';
  const timestamp=Date.parse(value+'T00:00:00Z');
  return Number.isFinite(timestamp)&&new Date(timestamp).toISOString().slice(0,10)===value?value:'';
}
for(const group of ['dated','undated']){
  $(group).onclick=()=>{dateGroup=group;limit=40;render()};
}
function teamDirectory(){
  const teams=sources.find(s=>s.id==='1')?.additional||[];
  $('team').innerHTML='<option value="">전체 팀</option>'+teams.map(t=>`<option value="${esc(t.team)}">${esc(t.team)} (${items.filter(x=>x.teams?.[t.team]).length})</option>`).join('');
  $('team-links').innerHTML=teams.map(t=>`<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.team)} ↗</a>`).join('');
}
function origins(x){
  if(x.teams)return Object.entries(x.teams).map(([name,url])=>`<a class="team-origin" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)} ↗</a>`).join(' · ');
  return `<a class="muted" href="${esc(x.listed_on)}" target="_blank" rel="noopener noreferrer">공식 게시 목록 ↗</a>`;
}
$('team').oninput=()=>{limit=40;render()};
function render(){let q=$('query').value.toLowerCase(),org=$('org').value,view=$('view').value;$('team-panel').hidden=org!=='1';const team=org==='1'?$('team').value:'';const matches=items.filter(x=>(!org||x.source===org)&&(!team||x.teams?.[team])&&(!q||(x.title+' '+(sources.find(s=>s.id===x.source)?.name||'')).toLowerCase().includes(q))&&(view==='all'||(view==='saved'?state[x.id]?.saved:!state[x.id]?.read)));
const dated=matches.filter(x=>x.published);
const undated=matches.filter(x=>!x.published);
$('dated').textContent='공홈 표기일 최신순 ('+dated.length+')';
$('undated').textContent='공홈 날짜 미확인 ('+undated.length+')';
for(const group of ['dated','undated'])$(group).setAttribute('aria-pressed',String(group===dateGroup));
const shown=dateGroup==='dated'?dated:undated;
$('results').textContent=(sources.find(s=>s.id===org)?.name||'전체 기관')+' · 연구 '+shown.length+'건';$('more').hidden=limit>=shown.length;document.querySelectorAll('[data-org]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.org===org)));$('feed').innerHTML=shown.length?shown.slice(0,limit).map(x=>{let s=sources.find(s=>s.id===x.source),st=state[x.id]||{};return `<article class="entry"><div class="meta">${esc(s?.name||x.source)} · ${origins(x)} · ${esc(x.published?'공홈 표기 '+x.published+(x.source==='5'?' (학회·출판 표기)':'')+' · ':'공홈 날짜 미확인 · ')}발견 ${esc(x.discovered.slice(0,10))}</div><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" data-id="${esc(x.id)}">${esc(x.title)}</a><footer><span class="tag">${st.read?'읽음':'미확인'}</span><div><button data-action="read" data-id="${esc(x.id)}">${st.read?'미읽음으로':'읽음'}</button> <button data-action="saved" data-id="${esc(x.id)}">${st.saved?'★ 저장됨':'☆ 저장'}</button></div></footer></article>`}).join(''):'<div class="empty">표시할 게시물이 없습니다. 검색어나 필터를 바꿔 보세요.</div>'}
$('feed').addEventListener('click',e=>{let el=e.target.closest('[data-id]');if(!el)return;let id=el.dataset.id,action=el.dataset.action||'read';state[id]??={};state[id][action]=el.tagName==="A"?true:!state[id][action];save();render()});['query','org','view'].forEach(id=>$(id).addEventListener('input',()=>{limit=40;render()}));
$('sources').addEventListener('click',e=>{const b=e.target.closest('[data-org]');if(!b)return;$('org').value=b.dataset.org;limit=40;render();$('results').scrollIntoView({block:'nearest'})});$('more').onclick=()=>{limit+=40;render()};
Promise.all([fetch('./data.json?cache='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),fetch('./sources.json').then(r=>r.json())]).then(([d,s])=>{sources=s;items=(d.items||[]).filter(x=>x.official_html===true && x.listed_on && s.some(org=>org.id===x.source && [org,...(org.additional||[])].some(page=>page.url===x.listed_on))).map(x=>({...x,published:publicationDay(x.published)})).sort((a,b)=>b.published.localeCompare(a.published)||a.title.localeCompare(b.title));status=d.status||{};$('sources-count').textContent=s.length;$('items-count').textContent=items.length;$('new-count').textContent=items.filter(x=>{const age=Math.floor((Date.now()+9*3600e3)/864e5)-Date.parse(x.published)/864e5;return x.published.length===10&&age>=0&&age<7}).length;$('updated').textContent=d.updated?'최근 수집: '+new Date(d.updated).toLocaleString('ko-KR'):'아직 수집 전';$('org').innerHTML='<option value="">모든 기관</option>'+s.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('sources').innerHTML=s.map(x=>`<div class="source"><button data-org="${esc(x.id)}"><strong>${esc(x.name)}</strong><span class="${status[x.id]?.ok?'ok':'error'}">${status[x.id]?.partial?'일부 수집':status[x.id]?.ok?(status[x.id].count+'건'):status[x.id]?.error==='공식 목록에서 연구 링크를 확인하지 못함'?'공식 게시글 0건':status[x.id]?.error?'최근 수집 실패':'확인 0건'}</span></button><a class="source-ref" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(x.name)} 공식 목록">↗</a></div>`).join('');teamDirectory();const params=new URLSearchParams(location.search);if(params.get('org')==='1'){$('org').value='1';if([...$('team').options].some(o=>o.value===params.get('team')))$('team').value=params.get('team')}render()}).catch(e=>{$('updated').textContent='데이터 로드 실패: '+e.message});
</script></body></html>
